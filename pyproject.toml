[project]
name = "moseley"
version = "2.0.1"
description = "Simulate XRF spectra to better understand them"
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "Frank Ligterink" }
]
requires-python = ">=3.14"
dependencies = [
    "holoviews>=1.23.2",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.2",
    "mendeleev>=1.3.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "xraydb>=4.5.8",
]

#[project.scripts]
#fix-uv-jupytext = "fix_uv_jupytext:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.jupytext]
formats = "ipynb,qmd" 

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pip>=26.2.1",
]


